# Builds the static site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so Journal posts go live on their publish date (06:00 Israel time).
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (and through it ChatGPT search / Copilot) about pages that changed
  # today, right after they are published. The key file lives in public/.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Notify IndexNow
        run: |
          tar -xf artifact.tar ./indexnow-urls.json
          if [ "$(cat indexnow-urls.json)" = "[]" ]; then echo "Nothing new today"; exit 0; fi
          jq -n --argjson urls "$(cat indexnow-urls.json)" \
            '{host: "coco-atelier.com", key: "0647f7fdee048e3a97c582e44550751e", keyLocation: "https://coco-atelier.com/0647f7fdee048e3a97c582e44550751e.txt", urlList: $urls}' > body.json
          cat body.json
          curl -sS -o /dev/null -w "IndexNow responded %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" --data @body.json
